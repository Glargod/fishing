<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tide App • NS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', system_ui, sans-serif; }
        .location-tab { transition: all 0.2s ease; }
        .location-tab.active { background-color: #3b82f6; color: white; }
    </style>
</head>
<body class="bg-zinc-950 text-slate-200 min-h-screen">
    <div class="max-w-2xl mx-auto p-4">
        <!-- Header -->
        <header class="bg-blue-600 rounded-3xl p-6 mb-6">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-3">
                    <span class="text-4xl">🌊</span>
                    <div>
                        <h1 id="location-name" class="text-3xl font-bold">Heather Beach</h1>
                        <p id="location-subtitle" class="text-blue-100">Nova Scotia, Canada</p>
                    </div>
                </div>
                <div>
                    <div id="current-time" class="text-right font-medium"></div>
                    <div class="text-xs text-blue-200 text-right">ADT</div>
                </div>
            </div>

            <!-- Location Selector -->
            <div class="flex bg-blue-700 rounded-2xl p-1">
                <button onclick="switchLocation('heather')" 
                        class="location-tab active flex-1 px-6 py-2 rounded-xl text-sm font-medium" id="tab-heather">
                    Heather Beach
                </button>
                <button onclick="switchLocation('economy')" 
                        class="location-tab flex-1 px-6 py-2 rounded-xl text-sm font-medium" id="tab-economy">
                    Economy, NS (Bay of Fundy)
                </button>
            </div>
        </header>

        <!-- Today Summary -->
        <div class="bg-zinc-900 rounded-3xl p-6 mb-6">
            <div class="flex justify-between items-start mb-6">
                <div>
                    <div class="text-slate-400 text-sm">TODAY</div>
                    <div id="today-date" class="text-xl font-semibold">Friday, June 12 2026</div>
                </div>
                <div id="fishing-badge" class="bg-emerald-900/60 text-emerald-400 px-4 py-2 rounded-2xl flex items-center gap-2 text-sm">
                    🐟 Good Fishing
                </div>
            </div>

            <div class="grid grid-cols-3 gap-4">
                <div class="bg-zinc-800 rounded-2xl p-5">
                    <div class="text-xs text-slate-400">NEXT HIGH</div>
                    <div id="next-high" class="text-3xl font-bold tabular-nums">9:57 PM</div>
                    <div id="next-high-height" class="text-emerald-400">1.43 m</div>
                </div>
                <div class="bg-zinc-800 rounded-2xl p-5">
                    <div class="text-xs text-slate-400">NEXT LOW</div>
                    <div id="next-low" class="text-3xl font-bold tabular-nums">3:14 PM</div>
                    <div id="next-low-height" class="text-amber-400">-0.17 m</div>
                </div>
                <div class="bg-zinc-800 rounded-2xl p-5">
                    <div class="text-xs text-slate-400">NOW</div>
                    <div id="current-height" class="text-3xl font-bold tabular-nums text-cyan-400">~0.9 m</div>
                    <div class="text-xs text-slate-400">Rising</div>
                </div>
            </div>
        </div>

        <!-- 7-Day Tide + Fishing -->
        <div class="bg-zinc-900 rounded-3xl p-6">
            <h2 class="font-semibold mb-5">7-Day Tide + Fishing</h2>
            <div id="tide-table" class="space-y-6"></div>
        </div>
    </div>

    <script>
        let currentLocation = 'heather';

        const heatherData = {
            name: "Heather Beach",
            subtitle: "Nova Scotia, Canada",
            today: {
                nextHigh: { time: "9:57 PM", height: "1.43 m" },
                nextLow: { time: "3:14 PM", height: "-0.17 m" },
                currentHeight: "~0.9 m"
            },
            days: [
                { date: "Fri 12", day: "Friday", fishing: "🐟", major: ["9:45 am", "10:02 pm"], minor: ["2:24 am", "6:06 pm"],
                  tides: [{t:"2:17 am", ty:"Low", h:"0.57 m"}, {t:"8:07 am", ty:"High", h:"1.60 m"}, {t:"3:14 pm", ty:"Low", h:"-0.17 m"}, {t:"9:57 pm", ty:"High", h:"1.43 m"}] },
                { date: "Sat 13", day: "Saturday", fishing: "🐟🐟", major: ["10:45 am", "11:08 pm"], minor: ["2:59 am", "7:31 pm"],
                  tides: [{t:"3:25 am", ty:"Low", h:"0.67 m"}, {t:"9:00 am", ty:"High", h:"1.66 m"}, {t:"4:12 pm", ty:"Low", h:"-0.35 m"}, {t:"11:03 pm", ty:"High", h:"1.52 m"}] },
                { date: "Sun 14", day: "Sunday", fishing: "🐟🐟🐟", major: ["11:47 am"], minor: ["3:45 am", "8:49 pm"],
                  tides: [{t:"4:33 am", ty:"Low", h:"0.72 m"}, {t:"9:53 am", ty:"High", h:"1.70 m"}, {t:"5:09 pm", ty:"Low", h:"-0.49 m"}] },
                { date: "Mon 15", day: "Monday", fishing: "🐟🐟", major: ["12:18 am", "12:48 pm"], minor: ["4:47 am", "10:46 am"] },
                { date: "Tue 16", day: "Tuesday", fishing: "🐟🐟", major: ["1:03 am", "1:39 pm"], minor: ["5:35 am", "11:39 am"] },
                { date: "Wed 17", day: "Wednesday", fishing: "🐟", major: ["1:58 am", "2:33 pm"], minor: ["6:31 am", "12:33 pm"] },
                { date: "Thu 18", day: "Thursday", fishing: "🐟", major: ["2:50 am", "3:30 pm"], minor: ["7:23 am", "1:30 pm"] }
            ]
        };

        const economyData = {
            name: "Economy, NS",
            subtitle: "Bay of Fundy (extreme tides)",
            today: {
                nextHigh: { time: "10:44 AM", height: "14.15 m" },
                nextLow: { time: "5:04 PM", height: "3.14 m" },
                currentHeight: "~8.5 m"
            },
            days: [
                { date: "Fri 12", day: "Friday", fishing: "🐟", major: ["10:44 am", "11:12 pm"], minor: ["4:40 am", "5:04 pm"],
                  tides: [{t:"4:40 am", ty:"Low", h:"2.9 m"}, {t:"10:44 am", ty:"High", h:"14.15 m"}, {t:"5:04 pm", ty:"Low", h:"3.14 m"}, {t:"11:12 pm", ty:"High", h:"14.99 m"}] },
                { date: "Sat 13", day: "Saturday", fishing: "🐟🐟", major: ["11:30 am"], minor: ["5:30 am", "6:00 pm"],
                  tides: [{t:"5:30 am", ty:"Low", h:"2.5 m"}, {t:"11:30 am", ty:"High", h:"14.8 m"}, {t:"6:00 pm", ty:"Low", h:"2.8 m"}] },
                { date: "Sun 14", day: "Sunday", fishing: "🐟🐟🐟", major: ["12:20 pm"], minor: ["6:20 am", "6:50 pm"],
                  tides: [{t:"6:20 am", ty:"Low", h:"2.1 m"}, {t:"12:20 pm", ty:"High", h:"15.2 m"}, {t:"6:50 pm", ty:"Low", h:"2.4 m"}] },
                { date: "Mon 15", day: "Monday", fishing: "🐟🐟", major: ["1:10 pm"], minor: ["7:10 am", "7:40 pm"],
                  tides: [{t:"7:10 am", ty:"Low", h:"1.8 m"}, {t:"1:10 pm", ty:"High", h:"15.5 m"}] },
                { date: "Tue 16", day: "Tuesday", fishing: "🐟🐟", major: ["2:00 pm"], minor: ["8:00 am", "8:30 pm"],
                  tides: [{t:"8:00 am", ty:"Low", h:"1.5 m"}, {t:"2:00 pm", ty:"High", h:"15.7 m"}] },
                { date: "Wed 17", day: "Wednesday", fishing: "🐟", major: ["2:50 pm"], minor: ["8:50 am", "9:20 pm"],
                  tides: [{t:"8:50 am", ty:"Low", h:"1.4 m"}, {t:"2:50 pm", ty:"High", h:"15.4 m"}] },
                { date: "Thu 18", day: "Thursday", fishing: "🐟", major: ["3:40 pm"], minor: ["9:40 am", "10:10 pm"],
                  tides: [{t:"9:40 am", ty:"Low", h:"1.6 m"}, {t:"3:40 pm", ty:"High", h:"14.9 m"}] }
            ]
        };

        function updateUI(data) {
            document.getElementById('location-name').textContent = data.name;
            document.getElementById('location-subtitle').textContent = data.subtitle;

            document.getElementById('next-high').textContent = data.today.nextHigh.time;
            document.getElementById('next-high-height').textContent = data.today.nextHigh.height;
            document.getElementById('next-low').textContent = data.today.nextLow.time;
            document.getElementById('next-low-height').textContent = data.today.nextLow.height;
            document.getElementById('current-height').textContent = data.today.currentHeight;

            const container = document.getElementById('tide-table');
            container.innerHTML = '';

            data.days.forEach(day => {
                let tideHTML = '';
                if (day.tides) {
                    tideHTML = day.tides.map(t => `
                        <div class="flex items-center gap-4 text-sm">
                            <div class="w-2 h-2 rounded-full ${t.ty === 'High' ? 'bg-cyan-400' : 'bg-orange-400'}"></div>
                            <span class="font-medium">${t.t}</span>
                            <span class="text-slate-400">${t.ty}</span>
                            <span class="ml-auto tabular-nums">${t.h}</span>
                        </div>
                    `).join('');
                }

                const html = `
                    <div class="border border-zinc-700 rounded-2xl p-5">
                        <div class="flex justify-between items-center mb-4">
                            <div>
                                <span class="font-semibold">${day.date}</span>
                                <span class="text-slate-400 ml-2">${day.day}</span>
                            </div>
                            <div class="text-3xl">${day.fishing}</div>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-6 mb-4 text-sm bg-zinc-950 p-4 rounded-xl">
                            <div>
                                <div class="text-emerald-400 text-xs mb-1">MAJOR</div>
                                ${day.major.map(t => `<div>${t}</div>`).join('')}
                            </div>
                            <div>
                                <div class="text-amber-400 text-xs mb-1">MINOR</div>
                                ${day.minor.map(t => `<div>${t}</div>`).join('')}
                            </div>
                        </div>
                        
                        ${tideHTML ? `<div class="space-y-2">${tideHTML}</div>` : ''}
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        function switchLocation(loc) {
            currentLocation = loc;
            document.getElementById('tab-heather').classList.remove('active');
            document.getElementById('tab-economy').classList.remove('active');

            if (loc === 'heather') {
                document.getElementById('tab-heather').classList.add('active');
                updateUI(heatherData);
            } else {
                document.getElementById('tab-economy').classList.add('active');
                updateUI(economyData);
            }
        }

        function updateClock() {
            const el = document.getElementById('current-time');
            if (el) {
                const now = new Date();
                el.textContent = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateUI(heatherData);
            updateClock();
            setInterval(updateClock, 30000);
        });
    </script>
</body>
</html>
