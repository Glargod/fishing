<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tidal Clocks</title>
    <style>
        body { font-family: Arial, sans-serif; margin:0; padding:20px; background: #0a2f4f; color: white; text-align: center; }
        .container { max-width: 520px; margin: 0 auto; background: rgba(255,255,255,0.1); padding: 20px; border-radius: 20px; }
        h1 { margin: 0 0 20px 0; }
        .tabs { display: flex; justify-content: center; margin-bottom: 20px; }
        .tab { padding: 12px 28px; margin: 0 6px; background: #1e4a6b; border: none; border-radius: 10px 10px 0 0; cursor: pointer; font-size: 1.15em; }
        .tab.active { background: #00bbff; color: black; font-weight: bold; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .clock-svg { margin: 15px auto; }
        .info { font-size: 2.2em; font-weight: bold; margin: 8px 0 4px 0; }
        .status { font-size: 1.45em; margin: 8px 0; }
        button { padding: 12px 28px; font-size: 1em; background: #00bbff; color: black; border: none; border-radius: 10px; cursor: pointer; margin: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌊 Tidal Clocks</h1>

        <div class="tabs">
            <button class="tab active" onclick="switchTab(0)">Pugwash</button>
            <button class="tab" onclick="switchTab(1)">Bay of Fundy</button>
        </div>

        <!-- Pugwash Tab -->
        <div id="tab0" class="tab-content active">
            <div class="station">Pugwash (01775)</div>
            <svg class="clock-svg" width="210" height="210" viewBox="0 0 210 210" id="pug-svg">
                <defs>
                    <linearGradient id="tideGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#ff5555"/>
                    <stop offset="50%" stop-color="#446688"/>
                    <stop offset="100%" stop-color="#1155aa"/>
                    </linearGradient>
                </defs>
                <circle cx="105" cy="105" r="92" fill="#0f1f33" stroke="url(#tideGradient)" stroke-width="18"/>
                <circle cx="105" cy="105" r="68" fill="none" stroke="#224466" stroke-width="8"/>
                <text x="105" y="38" text-anchor="middle" fill="#ffdd88" font-size="14">HIGH</text>
                <text x="105" y="182" text-anchor="middle" fill="#88eeff" font-size="14">LOW</text>
                <line id="pug-hand" x1="105" y1="105" x2="105" y2="28" stroke="#ff4444" stroke-width="9" stroke-linecap="round"/>
                <circle cx="105" cy="105" r="14" fill="#ffdd44"/>
            </svg>
            <div class="info">2.1 m</div>
            <div class="status">🌊 Ebbing (Falling)</div>
            <div id="pug-next" style="margin-top:8px;">Next Low in calculating...</div>
        </div>

        <!-- Bay of Fundy Tab -->
        <div id="tab1" class="tab-content">
            <div class="station">Bay of Fundy (Burntcoat Head)</div>
            <svg class="clock-svg" width="210" height="210" viewBox="0 0 210 210" id="burn-svg">
                <defs>
                    <linearGradient id="tideGradient2" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#ff5555"/>
                    <stop offset="50%" stop-color="#446688"/>
                    <stop offset="100%" stop-color="#1155aa"/>
                    </linearGradient>
                </defs>
                <circle cx="105" cy="105" r="92" fill="#0f1f33" stroke="url(#tideGradient2)" stroke-width="18"/>
                <circle cx="105" cy="105" r="68" fill="none" stroke="#224466" stroke-width="8"/>
                <text x="105" y="38" text-anchor="middle" fill="#ffdd88" font-size="14">HIGH</text>
                <text x="105" y="182" text-anchor="middle" fill="#88eeff" font-size="14">LOW</text>
                <line id="burn-hand" x1="105" y1="105" x2="105" y2="28" stroke="#ff4444" stroke-width="9" stroke-linecap="round"/>
                <circle cx="105" cy="105" r="14" fill="#ffdd44"/>
            </svg>
            <div class="info">3.8 m</div>
            <div class="status">🌊 Flooding (Rising)</div>
            <div id="burn-next" style="margin-top:8px;">Next High in calculating...</div>
        </div>

        <button onclick="window.location.reload()">↻ Refresh Page</button>
    </div>

    <script>
        function switchTab(n) {
            document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i===n));
            document.querySelectorAll('.tab-content').forEach((c,i) => c.classList.toggle('active', i===n));
        }

        // Set rotation degrees (0 = Low, 180 = High)
        const pugRotation = 135;   // change as needed
        const burnRotation = 240;  // change as needed

        document.getElementById('pug-hand').setAttribute('transform', `rotate(${pugRotation} 105 105)`);
        document.getElementById('burn-hand').setAttribute('transform', `rotate(${burnRotation} 105 105)`);

        // Countdowns (update times as needed)
        const pugNext = new Date("2026-06-26T02:55:00");
        const burnNext = new Date("2026-06-26T01:45:00");

        function updateCountdowns() {
            const now = new Date();

            let diff = pugNext - now;
            if (diff > 0) {
                const h = Math.floor(diff / (1000*60*60));
                const m = Math.floor((diff % (1000*60*60)) / (1000*60));
                document.getElementById('pug-next').textContent = `Next Low in ${h}h ${m}min (≈ ${pugNext.toLocaleTimeString('en-CA', {hour:'numeric', minute:'2-digit'})} ADT)`;
            }

            diff = burnNext - now;
            if (diff > 0) {
                const h = Math.floor(diff / (1000*60*60));
                const m = Math.floor((diff % (1000*60*60)) / (1000*60));
                document.getElementById('burn-next').textContent = `Next High in ${h}h ${m}min (≈ ${burnNext.toLocaleTimeString('en-CA', {hour:'numeric', minute:'2-digit'})} ADT)`;
            }
        }

        updateCountdowns();
        setInterval(updateCountdowns, 30000);
    </script>
</body>
</html>
